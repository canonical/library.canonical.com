#
# Root-level tox.ini used by the canonical/operator-workflows integration test
# workflow, which runs tox from the repository root (working-directory: ".").
# This delegates to charm/tox.ini while keeping all paths correct so that
# --charm-file and --library-rock-image arguments resolve relative to ".".

[tox]
min_version = 4.0.0
env_list = integration

[testenv:integration]
description = Run integration tests (delegates to charm/tox.ini, run from repo root)
deps =
    pytest
    juju
    pytest-operator
    -r {tox_root}/charm/requirements.txt
set_env =
    PYTHONPATH = {tox_root}/charm/lib:{tox_root}/charm/src
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS
commands =
    pytest -v \
           -s \
           --tb native \
           --log-cli-level=INFO \
           {posargs} \
           {tox_root}/charm/tests/integration
